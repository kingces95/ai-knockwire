# knockwire guid-cert service account.
# Keys come from the registration state via AuthorizedKeysCommand, so
# revocation is re-checked on every connection attempt — a static
# file cannot do that. Forwarding only, one restricted port per key.
Match User kw
    AuthorizedKeysCommand /usr/local/bin/kw-authkeys %f
    AuthorizedKeysCommandUser root
    AuthorizedKeysFile none
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding remote
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitTunnel no
